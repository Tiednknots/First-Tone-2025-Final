---
layout: layouts/admin.njk
currentTab: dashboard
---

<section id="dashboard-view" class="tab-view space-y-8">
          <!-- Metric Cards -->
          <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="glass p-6 rounded-2xl flex items-center justify-between">
              <div>
                <span class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Page Views (30d)</span>
                <h3 class="text-3xl font-bold text-white mt-2" id="metric-views">-</h3>
              </div>
              <div class="h-12 w-12 bg-brand-500/10 rounded-xl flex items-center justify-center border border-brand-500/20 text-brand-500 text-xl">
                <i class="fa-solid fa-eye"></i>
              </div>
            </div>
            
            <div class="glass p-6 rounded-2xl flex items-center justify-between">
              <div>
                <span class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Contact Messages</span>
                <h3 class="text-3xl font-bold text-white mt-2" id="metric-messages">-</h3>
              </div>
              <div class="h-12 w-12 bg-zinc-800/30 rounded-xl flex items-center justify-center border border-zinc-800 text-zinc-300 text-xl">
                <i class="fa-solid fa-envelope-open-text"></i>
              </div>
            </div>
            
            <div class="glass p-6 rounded-2xl flex items-center justify-between">
              <div>
                <span class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Total Projects</span>
                <h3 class="text-3xl font-bold text-white mt-2" id="metric-projects">-</h3>
              </div>
              <div class="h-12 w-12 bg-zinc-800/30 rounded-xl flex items-center justify-center border border-zinc-800 text-zinc-300 text-xl">
                <i class="fa-solid fa-clapperboard"></i>
              </div>
            </div>

            <div class="glass p-6 rounded-2xl flex items-center justify-between">
              <div>
                <span class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Newsletter Subs</span>
                <h3 class="text-3xl font-bold text-white mt-2" id="metric-news">-</h3>
              </div>
              <div class="h-12 w-12 bg-zinc-800/30 rounded-xl flex items-center justify-center border border-zinc-800 text-zinc-300 text-xl">
                <i class="fa-solid fa-paper-plane"></i>
              </div>
            </div>
          </div>

          <!-- Charts Section -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glass p-6 rounded-2xl md:col-span-2 flex flex-col h-96">
              <h4 class="text-sm font-semibold uppercase tracking-wider text-zinc-300 mb-4">Traffic Statistics (Last 30 Days)</h4>
              <div class="flex-1 relative">
                <canvas id="traffic-chart"></canvas>
              </div>
            </div>
            <div class="glass p-6 rounded-2xl flex flex-col h-96">
              <h4 class="text-sm font-semibold uppercase tracking-wider text-zinc-300 mb-4">Devices Class</h4>
              <div class="flex-1 relative flex items-center justify-center">
                <canvas id="devices-chart" class="max-h-64"></canvas>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Top Pages -->
            <div class="glass p-6 rounded-2xl">
              <h4 class="text-sm font-semibold uppercase tracking-wider text-zinc-300 mb-4">Top Pages Visited</h4>
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="border-b border-zinc-800 text-zinc-400 text-xs uppercase tracking-wider">
                      <th class="py-3">Page Path</th>
                      <th class="py-3 text-right">Views</th>
                    </tr>
                  </thead>
                  <tbody id="top-pages-table">
                    <!-- Insert list items dynamically -->
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Top Referrers -->
            <div class="glass p-6 rounded-2xl">
              <h4 class="text-sm font-semibold uppercase tracking-wider text-zinc-300 mb-4">Referring Domains</h4>
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="border-b border-zinc-800 text-zinc-400 text-xs uppercase tracking-wider">
                      <th class="py-3">Source</th>
                      <th class="py-3 text-right">Views</th>
                    </tr>
                  </thead>
                  <tbody id="top-referrers-table">
                    <!-- Insert list items dynamically -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </section>
