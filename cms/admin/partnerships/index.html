---
layout: layouts/admin.njk
currentTab: partnerships
---

<section id="partnerships-view" class="tab-view space-y-6">
          <div class="flex justify-between items-center">
            <h3 class="text-lg font-bold text-white">Manage Partnerships</h3>
            <button onclick="openPartnershipEditor()" class="px-4 py-2.5 bg-brand-500 hover:bg-brand-600 rounded-xl text-sm font-semibold flex items-center gap-2 transition">
              <i class="fa-solid fa-plus"></i> Add New Partnership
            </button>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-6" id="partnerships-list">
            <!-- Dynamically populated partnerships -->
          </div>

          <!-- Partnership Editor Modal -->
          <div id="partnership-editor-modal" class="fixed inset-0 z-45 bg-black/80 backdrop-blur-sm flex justify-center items-center">
            <div class="glass w-full max-w-md p-8 rounded-2xl shadow-2xl border border-zinc-800">
              <div class="flex justify-between items-center mb-6">
                <h4 id="partnership-editor-title" class="text-lg font-bold text-white">Edit Partnership</h4>
                <button onclick="closePartnershipEditor()" class="text-zinc-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
              </div>
              <form id="partnership-form" class="space-y-5">
                <input type="hidden" id="partnership-id">
                <div>
                  <label class="block text-xs font-semibold uppercase text-zinc-400 mb-2">Partner Name</label>
                  <input type="text" id="partnership-title" required class="w-full px-4 py-3 bg-black border border-zinc-800 rounded-xl text-white focus:outline-none focus:border-brand-500 transition">
                </div>
                <div>
                  <label class="block text-xs font-semibold uppercase text-zinc-400 mb-2">Slug</label>
                  <input type="text" id="partnership-slug" required class="w-full px-4 py-3 bg-black border border-zinc-800 rounded-xl text-white focus:outline-none focus:border-brand-500 transition">
                </div>
                <div>
                  <label class="block text-xs font-semibold uppercase text-zinc-400 mb-2">Logo/Brand Image</label>
                  <div class="drop-zone border-2 border-dashed border-zinc-800 hover:border-brand-500/50 rounded-2xl p-6 text-center cursor-pointer transition flex flex-col items-center justify-center bg-black/40 relative min-h-[160px]" data-field="partnership-image">
                    <input type="file" class="hidden file-input" accept="image/*">
                    <div class="drop-zone-content flex flex-col items-center">
                      <i class="fa-solid fa-image text-brand-500 text-3xl mb-3"></i>
                      <span class="text-sm font-semibold text-zinc-200">Drag & Drop or Click</span>
                    </div>
                    <div class="preview-img-container absolute inset-0 rounded-2xl overflow-hidden bg-zinc-950 flex items-center justify-center">
                      <img src="" class="h-full w-full object-cover">
                      <button type="button" onclick="clearDropZone(event)" class="absolute top-2 right-2 bg-black/80 hover:bg-red-500 p-2 rounded-full text-white transition"><i class="fa-solid fa-trash-can text-sm"></i></button>
                    </div>
                  </div>
                </div>
                <div class="flex justify-end gap-3 pt-4 border-t border-zinc-800">
                  <button type="button" onclick="closePartnershipEditor()" class="px-5 py-2.5 bg-zinc-900 hover:bg-slate-700 text-zinc-300 rounded-xl text-sm transition">Cancel</button>
                  <button type="submit" class="px-6 py-2.5 bg-brand-500 hover:bg-brand-600 text-white rounded-xl text-sm font-semibold transition">Save Partner</button>
                </div>
              </form>
            </div>
          </div>

        <!-- ================= SITE SETTINGS VIEW ================= -->
